<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>항성 연출 후보 · 분광 관측 vs 시차 측정</title>
<style>
/* 본편과 같은 제약: 외부 폰트·스크립트 없음. 이 파일 하나로 동작한다. */
:root{
  --bg:#04050b; --panel:#0d1222; --line:rgba(140,175,255,.16); --line-2:rgba(140,175,255,.32);
  --txt:#e8eefc; --txt-2:#98a6c8; --txt-3:#5f6d90;
  --acc:#8ab4ff; --gold:#ffc65c; --ok:#6fe6b0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);min-height:100vh;font-size:14px;line-height:1.6;
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input{font-family:inherit;color:var(--txt);touch-action:manipulation}
.wrap{max-width:660px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:19px;font-weight:700;margin-bottom:3px}
.sub{font-size:12.5px;color:var(--txt-3);margin-bottom:18px}

.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tab{padding:11px 8px;border-radius:12px;cursor:pointer;font-size:13px;font-weight:700;
  background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--txt-2);line-height:1.35}
.tab .kd{display:block;font-size:10px;font-weight:600;color:var(--txt-3);margin-top:2px}
.tab.on{background:linear-gradient(160deg,rgba(58,90,180,.42),rgba(40,60,140,.3));
  border-color:var(--line-2);color:#fff}
.tab.on .kd{color:var(--acc)}

.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;padding:8px 6px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;
  background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--txt-3)}
.seg button.on{border-color:var(--line-2);color:#fff;background:rgba(138,180,255,.12)}

.stage{position:relative;width:100%;aspect-ratio:3/4;border-radius:16px;overflow:hidden;
  background:#04050b;border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:100%}

.ctl{display:flex;align-items:center;gap:11px;margin-top:12px}
.play{width:42px;height:42px;flex:0 0 auto;border-radius:12px;cursor:pointer;
  background:linear-gradient(160deg,#3b63c9,#2a3f8f);border:1px solid rgba(160,190,255,.4);
  display:grid;place-items:center}
.play svg{width:17px;height:17px;fill:#fff}
input[type=range]{flex:1;accent-color:var(--acc)}
.pct{font-size:12px;color:var(--txt-3);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;margin-top:14px}
.card h3{font-size:13.5px;font-weight:700;margin-bottom:7px}
.card p{font-size:12.5px;color:var(--txt-2);margin-bottom:9px}
.card p:last-child{margin-bottom:0}
.card b{color:var(--txt)}
.why{font-size:11.5px;color:var(--ok);border-left:2px solid rgba(111,230,176,.4);
  padding-left:9px;margin:9px 0}
.warn{font-size:11.5px;color:#ff9b7d;border-left:2px solid rgba(255,138,107,.45);
  padding-left:9px;margin:9px 0}
.note{font-size:11.5px;color:var(--txt-3);line-height:1.75;margin-top:18px;
  border-top:1px solid var(--line);padding-top:14px}
.note b{color:var(--txt-2)}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
th{text-align:left;font-size:10px;letter-spacing:.06em;color:var(--txt-3);font-weight:700;
  padding:0 7px 6px;border-bottom:1px solid var(--line)}
td{padding:7px;border-bottom:1px solid rgba(140,175,255,.07);color:var(--txt-2)}
td b{color:var(--txt)}
</style>
</head>
<body>
<div class="wrap">
  <h1>항성 연출 후보</h1>
  <div class="sub">다섯 번째 연출 · 완주하면 <b>항성</b>을 얻는다 · <b>본편에는 적용하지 않았습니다</b></div>

  <div class="tabs" id="tabs"></div>
  <div class="seg" id="seg">
    <button data-m="focus" class="on">집중 중 (25분 내내)</button>
    <button data-m="reveal">완주 결말 (4.2초)</button>
  </div>

  <div class="stage"><canvas id="cv"></canvas></div>

  <div class="ctl">
    <button class="play" id="play" title="재생"><svg id="playIco" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></button>
    <input type="range" id="sl" min="0" max="1000" value="0">
    <span class="pct" id="pct">0%</span>
  </div>

  <div class="card" id="desc"></div>

  <div class="note">
    <b>무대 구성을 보는 용도입니다.</b> 천체 표면은 간단한 절차적 그림으로 대신했고,
    본편에 넣으면 도감과 같은 <code>drawGlobe</code> 로 그립니다.<br><br>
    <b>남은 시간을 화면으로 읽을 수 있어야 합니다</b> — 지금 네 연출이 모두 그렇습니다
    (표적 수 · 혜성까지의 거리 · 광도 곡선 · 수신률). 두 후보도 같은 규칙을 지켰습니다.
  </div>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(p,a,b)=>clamp((p-a)/(b-a),0,1);
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);
function rgba(hex,a){const h=hex.replace('#','');
  const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function fnv(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const MONO='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';

/* 대상 항성 — 태양과 닮은 G2V. STAR_POOL 에 실제로 있는 종류다. */
const TARGET={n:'타우 세티',en:'Tau Ceti',cls:'G형 주계열성',t:4,
  c1:'#fff3d0',c2:'#ffc861',
  d:'태양과 가장 닮은 이웃별. 12광년 거리에 있다.'};

/* ── 공용 겉면 ─────────────────────────────────────────────── */
function chrome(x,W,H,color,fade){
  const M=Math.min(W,H), step=M/16;
  x.save(); x.strokeStyle=rgba(color,.05*fade); x.lineWidth=1; x.beginPath();
  for(let gx=step/2;gx<W;gx+=step){x.moveTo(gx,0);x.lineTo(gx,H);}
  for(let gy=step/2;gy<H;gy+=step){x.moveTo(0,gy);x.lineTo(W,gy);}
  x.stroke(); x.restore();
  const g=x.createRadialGradient(W/2,H/2,M*.30,W/2,H/2,Math.max(W,H)*.66);
  g.addColorStop(0,'rgba(4,5,11,0)'); g.addColorStop(1,'rgba(4,5,11,.80)');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.save(); x.strokeStyle=rgba(color,.28*fade+.12); x.lineWidth=1.2;
  const m=M*.035, L=M*.045;
  [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(q=>{
    x.beginPath(); x.moveTo(q[0]+q[2]*L,q[1]); x.lineTo(q[0],q[1]);
    x.lineTo(q[0],q[1]+q[3]*L); x.stroke(); });
  x.restore();
}
function readout(x,W,H,lines,color,alpha,ty){
  if(alpha<=0)return;
  const M=Math.min(W,H), s=Math.max(10,M*.0215);
  x.save(); x.globalAlpha=alpha; x.textAlign='left';
  x.font=s+'px '+MONO; x.fillStyle=rgba(color,.95);
  const bx=M*.075, by=ty===undefined?M*.11:ty, lh=s*1.5;
  lines.filter(Boolean).forEach((t,i)=>x.fillText(t,bx,by+lh*i));
  x.restore();
}
function status(x,W,H,txt,color){
  x.save(); x.textAlign='center';
  x.font='500 10px '+MONO; x.fillStyle=rgba(color,.62);
  x.fillText(txt,W/2,H-Math.min(W,H)*.055); x.restore();
}
function spaced(x,txt,cx,y,font,sp){
  x.font=font; let w=-sp;
  for(const ch of txt) w+=x.measureText(ch).width+sp;
  let px=cx-w/2;
  for(const ch of txt){ x.fillText(ch,px,y); px+=x.measureText(ch).width+sp; }
}
/** 별 — 코로나 + 원반. 색온도에 따라 색이 달라진다 */
function star(x,cx,cy,R,c1,c2,alpha){
  x.save(); if(alpha!==undefined)x.globalAlpha=alpha;
  const g=x.createRadialGradient(cx,cy,0,cx,cy,R*3.2);
  g.addColorStop(0,rgba(c1,.95)); g.addColorStop(.22,rgba(c2,.55));
  g.addColorStop(1,rgba(c2,0));
  x.fillStyle=g; x.beginPath(); x.arc(cx,cy,R*3.2,0,TAU); x.fill();
  x.fillStyle=c1; x.beginPath(); x.arc(cx,cy,R,0,TAU); x.fill();
  x.restore();
}
/** 배경 별밭 — 시차 연출에 쓴다 */
function field(x,W,H,seed,n,shift){
  const r=mulberry(seed);
  for(let i=0;i<n;i++){
    const bx=r()*W, by=r()*H, s=.4+r()*1.5, a=.15+r()*.5;
    x.fillStyle=rgba('#c8d6ee',a);
    x.beginPath(); x.arc(bx+(shift||0)*(0.2+r()*0.1),by,s,0,TAU); x.fill();
  }
}

/* ══════════════════════════════════════════════════════════════
   후보 A · 분광 관측 — 흡수선이 잡음 위로 하나씩 떠오른다

   실제 관측 화면을 따랐다. 무지개 띠는 교과서용 그림이고, 관측자가
   실제로 보는 것은 **플럭스 대 파장 그래프**다 — 들쭉날쭉한 선이고
   흡수선은 아래로 파인 골이다. 그 위에 원본 2D 프레임(회색 띠에 검은
   세로줄)을 같이 놓는 것이 보통이다.

   **강한 선부터 떠오른다.** SNR 이 √노출시간으로 자라므로 깊은 선
   (Ca II K · Hα)이 먼저 잡음을 뚫고, 약한 철선이 나중에 나온다.
   ══════════════════════════════════════════════════════════════ */
/* 실측 파장(nm)과 태양형(G2V) 별에서의 대략적인 선 깊이.
   depth 는 연속광 대비 얼마나 파이는가 — 이 순서대로 잡음 위로 떠오른다. */
const LINES=[
  {nm:393.4,el:'Ca II K',depth:.72},
  {nm:396.8,el:'Ca II H',depth:.66},
  {nm:656.3,el:'H α',    depth:.52},
  {nm:589.0,el:'Na D',   depth:.48},
  {nm:486.1,el:'H β',    depth:.44},
  {nm:517.3,el:'Mg b',   depth:.40},
  {nm:430.8,el:'G band', depth:.36},
  {nm:434.0,el:'H γ',    depth:.32},
  {nm:410.2,el:'H δ',    depth:.26},
  {nm:422.7,el:'Ca I',   depth:.22},
  {nm:438.4,el:'Fe I',   depth:.19},
  {nm:527.0,el:'Fe I',   depth:.16},
  {nm:495.8,el:'Fe I',   depth:.13},
  {nm:610.3,el:'Ca I',   depth:.11}
];
const NM0=380, NM1=700;
/* 한 번의 판독(readout) 주기. 실제 관측도 노출을 여러 번 나눠 받고 그때마다
   그래프가 갱신된다 — 매 프레임 새로 뽑으면 관측 그래프가 아니라 TV 노이즈가
   되고, 아예 고정하면 죽은 그림이 된다. 그 사이가 이 값이다. */
const SP_READOUT=2200;
/* 분광형 후보 — 관측이 쌓일수록 좁혀진다. 실제로도 표준성 스펙트럼과
   맞춰 보며 좁힌다(template matching). */
const TYPES=['O','B','A','F','G','K','M'];

/** 파장 → 눈에 보이는 색. 2D 프레임을 옅게 물들이는 데만 쓴다. */
function nmColor(nm){
  let r=0,g=0,b=0;
  if(nm<440){r=-(nm-440)/60;b=1;}
  else if(nm<490){g=(nm-440)/50;b=1;}
  else if(nm<510){g=1;b=-(nm-510)/20;}
  else if(nm<580){r=(nm-510)/70;g=1;}
  else if(nm<645){r=1;g=-(nm-645)/65;}
  else {r=1;}
  const f=nm>645?.3+.7*(700-nm)/55:nm<420?.3+.7*(nm-380)/40:1;
  return [Math.round(255*Math.pow(Math.max(0,r)*f,.8)),
          Math.round(255*Math.pow(Math.max(0,g)*f,.8)),
          Math.round(255*Math.pow(Math.max(0,b)*f,.8))];
}

/** 노출이 쌓인 정도(0~1) → 지금 몇 개의 선이 잡음을 뚫었는가.
    SNR ∝ √t 이고, 선은 depth 가 잡음보다 커질 때 보인다. */
function linesUp(expo){
  const snr=1.2+Math.sqrt(Math.max(0,expo))*26;   // dB 비슷한 값
  const noise=1.35/snr;                            // 잡음 진폭
  let n=0; LINES.forEach(L=>{ if(L.depth>noise*2.6) n++; });
  return {n, snr, noise};
}

function drawSpectro(x,W,H,p,now,mode){
  const M=Math.min(W,H), cx=W/2;
  const rev = mode==='reveal';
  const expo = rev ? 1 : p;
  const back = rev ? clamp(1-seg(p,.45,.72),0,1) : 1;
  const st = linesUp(expo);
  const found = rev ? LINES.length : st.n;

  /* ── 슬릿을 겨눈 대상 별 ── */
  const sy=H*0.155, sR=M*0.024;
  star(x,cx,sy,sR*(rev?lerp(1,1.5,ease(seg(p,.45,.8))):1),
       rev&&seg(p,.5,.8)>0?'#fff3d0':'#e9eef8',
       rev&&seg(p,.5,.8)>0?'#ffc861':'#9fb4d8', back*.9+.1);
  if(back>.02){
    x.save(); x.globalAlpha=back;
    x.strokeStyle=rgba('#c9a6ff',.45); x.lineWidth=1;
    // 슬릿 — 별빛이 여기로 들어간다
    x.beginPath(); x.moveTo(cx-M*.055,sy+sR*2.8); x.lineTo(cx+M*.055,sy+sR*2.8); x.stroke();
    x.beginPath(); x.moveTo(cx,sy+sR*2.8); x.lineTo(cx,H*0.275); x.stroke();
    x.textAlign='center'; x.font='9px '+MONO; x.fillStyle=rgba('#c9a6ff',.45);
    x.fillText('SLIT',cx+M*.078,sy+sR*2.8+3);
    x.restore();
  }

  const gw=W*0.80, gx0=(W-gw)/2;
  const nmToX=nm=>gx0+gw*(nm-NM0)/(NM1-NM0);

  /* ── ① 원본 2D 프레임 — 회색 띠에 검은 세로줄 ── */
  const fy=H*0.285, fh=M*0.075;
  if(back>.02){
    x.save(); x.globalAlpha=back;
    // 연속광 — 색온도를 아주 옅게만 물들인다(실제 화면도 거의 흑백이다)
    const g=x.createLinearGradient(gx0,0,gx0+gw,0);
    for(let i=0;i<=24;i++){ const nm=lerp(NM0,NM1,i/24), c=nmColor(nm);
      g.addColorStop(i/24,`rgb(${Math.round(150+c[0]*.35)},${Math.round(150+c[1]*.35)},${Math.round(150+c[2]*.35)})`); }
    x.fillStyle=g; x.fillRect(gx0,fy,gw,fh);
    // 세로로는 슬릿 상이라 위아래가 어둡다
    const v=x.createLinearGradient(0,fy,0,fy+fh);
    v.addColorStop(0,'rgba(4,5,11,.85)'); v.addColorStop(.5,'rgba(4,5,11,0)');
    v.addColorStop(1,'rgba(4,5,11,.85)');
    x.fillStyle=v; x.fillRect(gx0,fy,gw,fh);
    // 검출된 선만 세로줄로 파인다
    LINES.forEach((L,i)=>{
      if(i>=found)return;
      const lx=nmToX(L.nm);
      x.fillStyle=rgba('#04050b',.55+L.depth*.45);
      x.fillRect(lx-1.2,fy,2.4,fh);
    });
    /* 읽기 잡음도 고정 패턴이다(실제로도 hot pixel 은 늘 같은 자리다).
       자리는 그대로 두고 **노출이 쌓이면 옅어지게만** 한다. */
    const rn=mulberry(0xF2A17);
    const na=clamp(0.18+st.noise*2.2,0,1);
    for(let i=0;i<240;i++){
      const px=gx0+rn()*gw, pyy=fy+rn()*fh, dark=rn()<.5, v=rn();
      x.fillStyle=rgba(dark?'#000000':'#ffffff',(.05+v*.16)*na);
      x.fillRect(px, pyy, 1+v*2, 1);
    }
    x.strokeStyle=rgba('#c9a6ff',.30); x.lineWidth=1; x.strokeRect(gx0,fy,gw,fh);
    x.textAlign='left'; x.font='9px '+MONO; x.fillStyle=rgba('#98a6c8',.45);
    x.fillText('RAW FRAME  ·  ECHELLE ORDER 34',gx0,fy-5);
    x.restore();
  }

  /* ── ② 추출한 1D 스펙트럼 — 관측자가 실제로 읽는 화면 ── */
  const py=H*0.415, ph=M*0.30;
  if(back>.02){
    x.save(); x.globalAlpha=back;
    // 축
    x.strokeStyle=rgba('#c9a6ff',.22); x.lineWidth=1;
    x.strokeRect(gx0,py,gw,ph);
    x.setLineDash([2,4]); x.strokeStyle=rgba('#c9a6ff',.18);
    [0.25,0.5,0.75].forEach(f=>{ x.beginPath();
      x.moveTo(gx0,py+ph*f); x.lineTo(gx0+gw,py+ph*f); x.stroke(); });
    x.setLineDash([]);
    x.textAlign='right'; x.font='9px '+MONO; x.fillStyle=rgba('#98a6c8',.45);
    x.fillText('1.0',gx0-5,py+ph*0.22+3);
    x.fillText('0.5',gx0-5,py+ph*0.61+3);
    x.save(); x.translate(gx0-M*.055,py+ph/2); x.rotate(-Math.PI/2);
    x.textAlign='center'; x.fillText('NORMALISED FLUX',0,0); x.restore();

    // 연속광 기준선
    const base=py+ph*0.22;
    x.setLineDash([5,4]); x.strokeStyle=rgba('#ffc65c',.35);
    x.beginPath(); x.moveTo(gx0,base); x.lineTo(gx0+gw,base); x.stroke(); x.setLineDash([]);

    /* 스펙트럼 자체. 잡음은 노출이 쌓일수록 줄고, 검출된 선만 골이 된다.
       한 세션 안에서 같은 모양이라야 하므로 잡음은 결정론적으로 뽑는다. */
    /* **잡음은 지직거리지 않는다.** 실제 스펙트럼의 잡음은 한 번 정해지면
       그대로 있고, 노출이 쌓이면 그 진폭이 줄어들 뿐이다. 매 프레임 새로
       뽑으면 관측 그래프가 아니라 TV 노이즈처럼 보인다. */
    /* 잡음은 **판독마다 한 번** 새로 뽑힌다. 진폭은 노출이 쌓일수록 준다 —
       새 프레임이 들어와 그래프가 다시 그려지는 것으로 읽힌다. */
    const frame=Math.floor(performance.now()/SP_READOUT);
    const rn=mulberry((0x5EC7^Math.imul(frame,2654435761))>>>0);
    x.strokeStyle=rgba('#e8eefc',.92); x.lineWidth=1.2;
    x.beginPath();
    const N=260;
    for(let i=0;i<=N;i++){
      const t=i/N, nm=lerp(NM0,NM1,t);
      let f=1;
      // 검출된 선은 가우시안 골로 판다
      LINES.forEach((L,k)=>{
        if(k>=found)return;
        const d=(nm-L.nm)/2.6;
        f-=L.depth*Math.exp(-d*d);
      });
      // 아직 못 뚫은 선도 잡음에 섞여 아주 얕게는 있다
      LINES.forEach((L,k)=>{
        if(k<found)return;
        const d=(nm-L.nm)/2.6;
        f-=L.depth*Math.exp(-d*d)*0.25*(1-st.noise);
      });
      f-=(rn()-.5)*st.noise*2.0;
      const qx=gx0+gw*t, qy=base+(1-clamp(f,-0.15,1.25))*ph*0.62;
      i?x.lineTo(qx,qy):x.moveTo(qx,qy);
    }
    x.stroke();

    // 검출된 선에 이름표
    x.textAlign='center'; x.font='9px '+MONO;
    LINES.forEach((L,i)=>{
      if(i>=found)return;
      const lx=nmToX(L.nm);
      x.strokeStyle=rgba('#c9a6ff',.30); x.lineWidth=1;
      x.beginPath(); x.moveTo(lx,py+ph*0.06); x.lineTo(lx,base+L.depth*ph*0.62); x.stroke();
      x.fillStyle=rgba('#c9a6ff',.75);
      x.save(); x.translate(lx,py+ph*0.05); x.rotate(-Math.PI/2);
      x.textAlign='left'; x.fillText(L.el,0,3); x.restore();
    });

    // 파장 눈금
    x.textAlign='center'; x.font='9px '+MONO;
    [400,450,500,550,600,650,700].forEach(nm=>{
      const lx=nmToX(nm);
      x.strokeStyle=rgba('#98a6c8',.30); x.lineWidth=1;
      x.beginPath(); x.moveTo(lx,py+ph); x.lineTo(lx,py+ph+4); x.stroke();
      x.fillStyle=rgba('#98a6c8',.45); x.fillText(nm,lx,py+ph+15);
    });
    x.fillText('WAVELENGTH (nm)',gx0+gw/2,py+ph+29);
    x.restore();
  }

  /* ── ③ 분광형 후보 — 표준성과 맞춰 좁힌다 ── */
  const ty=H*0.80;
  if(back>.02){
    x.save(); x.globalAlpha=back;
    const bw=gw/TYPES.length;
    // 검출된 선이 많을수록 후보가 좁아진다 (G 로 수렴)
    const conf=clamp(found/LINES.length,0,1);
    x.textAlign='center'; x.font='10px '+MONO;
    TYPES.forEach((T,i)=>{
      const d=Math.abs(i-4);                       // G 가 정답
      const alive = conf < 0.30 ? 1
                  : conf < 0.62 ? (d<=1?1:0.18)
                  : (d===0?1:0.10);
      x.fillStyle=rgba(alive>.5?'#c9a6ff':'#5f6d90', alive);
      x.fillRect(gx0+bw*i+2, ty, bw-4, M*0.012);
      x.fillStyle=rgba(alive>.5?'#eef3ff':'#5f6d90', Math.max(.25,alive));
      x.fillText(T, gx0+bw*i+bw/2, ty-6);
    });
    x.textAlign='left'; x.font='9px '+MONO; x.fillStyle=rgba('#98a6c8',.45);
    x.fillText('TEMPLATE MATCH',gx0,ty-18);
    x.restore();
  }

  /* ── 결말: 분류가 확정되고 별이 제 색을 얻는다 ── */
  if(rev && seg(p,.45,1)>0){
    const e=easeOut(seg(p,.84,.96));
    const R=lerp(M*.04,M*.185,ease(seg(p,.45,.86)));
    const bx2=lerp(cx,W*0.30,e), by2=lerp(sy,H/2,e);
    star(x,bx2,by2,R,'#fff3d0','#ffc861',1);
    const t=seg(p,.92,1);
    if(t>0){
      const a=easeOut(t), F=Math.min(W*.44,M*.058)*0.9;
      x.save(); x.globalAlpha=a; x.textAlign='left';
      const tx=W*0.52; let y=H/2-M*0.14;
      x.font=Math.max(12,F*.52)+'px '+MONO; x.fillStyle=rgba('#c396ff',1);
      x.fillText('★★★★☆',tx,y); y+=F*1.15;
      x.font='700 '+F+'px Pretendard,system-ui,sans-serif'; x.fillStyle='#eef3ff';
      x.fillText(TARGET.n,tx,y); y+=F*.62;
      x.font=Math.max(11,F*.42)+'px '+MONO; x.fillStyle=rgba('#98a6c8',.62);
      x.fillText(TARGET.en,tx,y); y+=M*.035;
      x.strokeStyle=rgba('#c9a6ff',.42); x.lineWidth=1;
      x.beginPath(); x.moveTo(tx,y); x.lineTo(tx+W*.16,y); x.stroke(); y+=M*.032;
      x.font=Math.max(12,F*.40)+'px Pretendard,system-ui,sans-serif';
      x.fillStyle=rgba('#c9a6ff',.92); x.fillText('G형 주계열성 · G2V',tx,y); y+=M*.042;
      x.font=Math.max(11.5,F*.36)+'px Pretendard,system-ui,sans-serif';
      x.fillStyle=rgba('#98a6c8',.88); x.fillText('태양과 가장 닮은 이웃별.',tx,y);
      x.restore();
    }
  }

  chrome(x,W,H,'#c9a6ff',rev?clamp(1-seg(p,.80,.95),0,1):1);
  const mm=Math.floor(expo*25), ss=Math.floor(expo*25*60)%60;
  readout(x,W,H, rev?[
    'SPECTROGRAPH  R=48000',
    'LINES      '+LINES.length+'/'+LINES.length,
    'Teff       5344 K',
    'TYPE       G2V'
  ]:[
    'SPECTROGRAPH  R=48000',
    'EXPOSURE   '+mm+'m '+String(ss).padStart(2,'0')+'s',
    'SNR        '+st.snr.toFixed(1),
    'LINES      '+found+'/'+LINES.length,
    'TYPE       '+(found<4?'?':found<9?'F–G?':'G2V')
  ],'#c9a6ff', rev?clamp(seg(p,.05,.18)-seg(p,.66,.78),0,1):1,
     rev?undefined:Math.min(W,H)*.045);

  if(rev && seg(p,.84,.94)>0){
    x.save(); x.globalAlpha=easeOut(seg(p,.84,.94))*(0.88+0.12*Math.sin(now/760));
    x.textAlign='left'; x.fillStyle=rgba('#86d9ab',.6);
    spaced(x,'CLASSIFIED',W*0.41,H/2+M*0.26,'500 10px '+MONO,3.2);
    x.restore();
  }else{
    status(x,W,H, rev?'흡수선이 분광형을 확정한다'
                    : found<4?'노출 중 · 선이 아직 잡음에 묻혀 있다'
                    : 'LINES '+found+'/'+LINES.length+' DETECTED','#c9a6ff');
  }
}

/* ══════════════════════════════════════════════════════════════
   후보 B · 시차 측정 — 한 바퀴 돌아야 거리가 나온다
   이 앱의 핵심 규칙(집중 시간 = 기준 궤도 한 바퀴)과 그대로 겹친다.
   ══════════════════════════════════════════════════════════════ */
function drawParallax(x,W,H,p,now,mode){
  const M=Math.min(W,H), cx=W/2, cy=H*0.46;
  const rev = mode==='reveal';
  const back = rev ? clamp(1-seg(p,.45,.72),0,1) : 1;
  const q = rev ? 1 : p;                       // 궤도를 돈 비율
  const ang = q*TAU;

  // 배경 별밭 — 아주 멀어서 움직이지 않는다
  x.save(); x.globalAlpha=back; field(x,W,H,20260901,150,0); x.restore();

  // 대상 별 — 관측 위치에 따라 좌우로 흔들린다(시차)
  const amp = M*0.055;
  const tx = cx + Math.cos(ang)*amp, ty = cy + Math.sin(ang)*amp*0.28;

  if(back>.02){
    x.save(); x.globalAlpha=back;
    // 지금까지 그린 시차 타원 — 남은 시간이 곧 남은 호다
    x.strokeStyle=rgba('#ffc65c',.30); x.lineWidth=1; x.setLineDash([3,4]);
    x.beginPath(); x.ellipse(cx,cy,amp,amp*0.28,0,0,TAU); x.stroke(); x.setLineDash([]);
    x.strokeStyle=rgba('#ffc65c',.85); x.lineWidth=1.6;
    x.beginPath(); x.ellipse(cx,cy,amp,amp*0.28,0,0,Math.max(.001,ang)); x.stroke();
    // 기준선 표시
    x.strokeStyle=rgba('#ffc65c',.25);
    x.beginPath(); x.moveTo(cx-amp,cy); x.lineTo(cx+amp,cy); x.stroke();
    x.restore();
  }
  star(x,tx,ty,M*0.020,'#fff3d0','#ffc861',back*.85+.15);
  if(back>.02){
    x.save(); x.globalAlpha=back;
    x.strokeStyle=rgba('#ffc65c',.8); x.lineWidth=1.4; x.lineCap='round';
    const s=M*.038;
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(d=>{
      x.beginPath();
      x.moveTo(tx+d[0]*s*.45,ty+d[1]*s*.45);
      x.lineTo(tx+d[0]*s,ty+d[1]*s); x.stroke(); });
    x.restore();
  }

  // 관측 위치 인셋 — 지금 궤도의 어디인가
  if(back>.02){
    const ix=W*0.80, iy=H*0.78, ir=M*0.075;
    x.save(); x.globalAlpha=back*.9;
    x.strokeStyle=rgba('#ffc65c',.35); x.lineWidth=1;
    x.beginPath(); x.ellipse(ix,iy,ir,ir*0.42,0,0,TAU); x.stroke();
    x.fillStyle=rgba('#ffd9a0',.95);
    x.beginPath(); x.arc(ix,iy,2.6,0,TAU); x.fill();
    x.fillStyle=rgba('#8ab4ff',.95);
    x.beginPath(); x.arc(ix+Math.cos(ang)*ir, iy+Math.sin(ang)*ir*0.42, 3.2,0,TAU); x.fill();
    x.textAlign='center'; x.font='9px '+MONO; x.fillStyle=rgba('#98a6c8',.55);
    x.fillText('OBSERVER',ix,iy+ir*0.42+14);
    x.restore();
  }

  // 결말 — 시차각이 확정되고 별이 앞으로
  if(rev && seg(p,.45,1)>0){
    const e=easeOut(seg(p,.84,.96));
    const R=lerp(M*.03,M*.19,ease(seg(p,.45,.86)));
    const gx=lerp(tx,W*0.30,e), gy=lerp(ty,H/2,e);
    star(x,gx,gy,R,'#fff3d0','#ffc861',1);
    const t=seg(p,.92,1);
    if(t>0){
      const a=easeOut(t), F=Math.min(W*.44,M*.058)*0.9;
      x.save(); x.globalAlpha=a; x.textAlign='left';
      const bx2=W*0.52; let y=H/2-M*0.14;
      x.font=Math.max(12,F*.52)+'px '+MONO; x.fillStyle=rgba('#c396ff',1);
      x.fillText('★★★★☆',bx2,y); y+=F*1.15;
      x.font='700 '+F+'px Pretendard,system-ui,sans-serif'; x.fillStyle='#eef3ff';
      x.fillText(TARGET.n,bx2,y); y+=F*.62;
      x.font=Math.max(11,F*.42)+'px '+MONO; x.fillStyle=rgba('#98a6c8',.62);
      x.fillText(TARGET.en,bx2,y); y+=M*.035;
      x.strokeStyle=rgba('#ffc65c',.42); x.lineWidth=1;
      x.beginPath(); x.moveTo(bx2,y); x.lineTo(bx2+W*.16,y); x.stroke(); y+=M*.032;
      x.font=Math.max(12,F*.40)+'px Pretendard,system-ui,sans-serif';
      x.fillStyle=rgba('#ffc65c',.92); x.fillText('G형 주계열성 · 11.9광년',bx2,y); y+=M*.042;
      x.font=Math.max(11.5,F*.36)+'px Pretendard,system-ui,sans-serif';
      x.fillStyle=rgba('#98a6c8',.88); x.fillText('태양과 가장 닮은 이웃별.',bx2,y);
      x.restore();
    }
  }

  chrome(x,W,H,'#ffc65c',rev?clamp(1-seg(p,.80,.95),0,1):1);
  const pi=(0.274*(rev?1:Math.min(1,p+0.02))).toFixed(3);
  const err=rev?0.001:(0.09*(1-p)+0.001);
  readout(x,W,H, rev?[
    'ASTROMETRY   TAU CETI',
    'BASELINE   2.00 AU',
    'π          0.274"',
    'd          11.9 ly'
  ]:[
    'ASTROMETRY   FIELD 44-A',
    'BASELINE   '+(2*Math.sin(Math.min(Math.PI,ang/2))).toFixed(2)+' AU',
    'π          '+pi+'" ±'+err.toFixed(3),
    'd          '+(p<0.12?'—':(3.26/Math.max(0.02,+pi)).toFixed(1)+' ly'),
    'ARC        '+Math.round(q*360)+'° / 360°'
  ],'#ffc65c', rev?clamp(seg(p,.05,.18)-seg(p,.66,.78),0,1):1,
     rev?undefined:Math.min(W,H)*.11);

  if(rev && seg(p,.84,.94)>0){
    x.save(); x.globalAlpha=easeOut(seg(p,.84,.94))*(0.88+0.12*Math.sin(now/760));
    x.textAlign='left'; x.fillStyle=rgba('#86d9ab',.6);
    spaced(x,'DISTANCE FIXED',W*0.41,H/2+M*0.26,'500 10px '+MONO,3.2);
    x.restore();
  }else{
    status(x,W,H, rev?'한 바퀴가 시차각을 확정한다'
                    : 'BASELINE '+Math.round(q*360)+'° / 360°','#ffc65c');
  }
}

/* ── 무대 ─────────────────────────────────────────────────── */
const FX=[
  {k:'spectro', n:'분광 관측', kd:'빛을 펼쳐 흡수선을 읽는다', draw:drawSpectro,
   ttl:'별을 분류하는 바로 그 방법',
   body:`화면이 셋입니다 — 위는 분광기가 받은 <b>원본 프레임</b>(회색 띠에 검은 세로줄),
     가운데는 거기서 뽑아낸 <b>플럭스 대 파장 그래프</b>, 아래는 표준성과 맞춰 좁혀 가는
     <b>분광형 후보</b>입니다. 노출이 쌓이면 잡음이 줄고 <b>깊은 선부터</b> 골이 되어
     떠오릅니다(SNR ∝ √t — Ca II K·Hα 가 먼저, 약한 철선이 나중).
     <b>남은 시간 = 아직 안 뚫린 선의 수</b>(14개 중 몇 개).`,
   why:`STAR_POOL 의 <b>cls</b>('G형 주계열성' · 'M형 적색왜성')가 바로 이 관측의 결과입니다.
     29종의 분류가 전부 여기서 나온 값이라, 얻는 것과 방법이 정확히 맞습니다.`,
   warn:`기존 넷은 모두 공간을 보는 연출인데 이것만 <b>계측 그래프</b>입니다. 결이 다르다고
     느끼실 수도 있습니다 — 다만 그래서 항성 전용임이 분명해지기도 합니다.<br>
     <b>영상을 못 봐서 실제 화면과 어긋난 데가 있을 수 있습니다.</b> 캡처 한 장 주시면 맞추겠습니다.`,
   done:'CLASSIFIED'},

  {k:'parallax', n:'시차 측정', kd:'한 바퀴 돌아야 거리가 나온다', draw:drawParallax,
   ttl:'이 앱의 규칙과 그대로 겹친다',
   body:`지구가 궤도를 도는 동안 가까운 별만 배경에 대해 흔들립니다. 그 각도가 거리를
     줍니다. <b>한 바퀴를 다 돌아야</b> 시차 타원이 닫히고 값이 확정됩니다.
     <b>남은 시간 = 아직 안 그린 호</b>(360° 중 몇 도).`,
   why:`이 앱의 핵심이 <b>"집중 시간 = 기준 궤도 한 바퀴"</b> 입니다. 시차 측정도 정확히
     한 바퀴가 필요합니다 — 규칙이 두 번 말하지 않고 한 번만 말하게 됩니다.`,
   warn:`시차가 주는 것은 <b>거리</b>지 별의 성질이 아닙니다. 도감의 분류·온도는 분광이
     알아낸 값이라, '이 관측으로 그걸 알았다'는 말은 조금 헐거워집니다.`,
   done:'DISTANCE FIXED'}
];

let cur=0, mode='focus', P=0, playing=false, raf=0, t0=0;
const cv=$('#cv'), ctx=cv.getContext('2d');
const DUR=()=> mode==='reveal'?4200:9000;      // 집중은 25분을 9초로 압축해 본다

function sizeCanvas(){
  const r=cv.getBoundingClientRect(), d=Math.min(2,devicePixelRatio||1);
  cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d);
  ctx.setTransform(d,0,0,d,0,0);
}
function render(now){
  const r=cv.getBoundingClientRect(), W=r.width, H=r.height;
  const d=Math.min(2,devicePixelRatio||1); ctx.setTransform(d,0,0,d,0,0);
  ctx.fillStyle='#04050b'; ctx.fillRect(0,0,W,H);
  FX[cur].draw(ctx,W,H,P,now||performance.now(),mode);
}
function loop(now){
  if(!playing)return;
  P=clamp((now-t0)/DUR(),0,1);
  $('#sl').value=Math.round(P*1000); $('#pct').textContent=Math.round(P*100)+'%';
  render(now);
  if(P>=1){ playing=false; $('#playIco').innerHTML='<path d="M7 4l13 8-13 8z"/>'; return; }
  raf=requestAnimationFrame(loop);
}
function play(){
  if(playing){ playing=false; cancelAnimationFrame(raf);
    $('#playIco').innerHTML='<path d="M7 4l13 8-13 8z"/>'; return; }
  playing=true; if(P>=1)P=0; t0=performance.now()-P*DUR();
  $('#playIco').innerHTML='<path d="M7 4h4v16H7zM13 4h4v16h-4z"/>';
  raf=requestAnimationFrame(loop);
}
function renderTabs(){
  $('#tabs').innerHTML=FX.map((f,i)=>
    `<button class="tab ${i===cur?'on':''}" data-i="${i}">${f.n}<span class="kd">${f.kd}</span></button>`).join('');
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    cur=+b.dataset.i; P=0; playing=false; cancelAnimationFrame(raf);
    renderTabs(); renderDesc(); render(); play();
  });
}
function renderDesc(){
  const f=FX[cur];
  $('#desc').innerHTML=`<h3>${f.ttl}</h3><p>${f.body}</p>
    <div class="why">${f.why}</div><div class="warn">${f.warn}</div>
    <table><thead><tr><th>항목</th><th>값</th></tr></thead><tbody>
      <tr><td>완료 문구</td><td><b>${f.done}</b></td></tr>
      <tr><td>강조색</td><td><b>${f.k==='spectro'?'보라 (분광)':'금색 (측성)'}</b></td></tr>
      <tr><td>남은 시간을 읽는 법</td><td><b>${f.k==='spectro'?'잡음을 뚫은 흡수선 수 (n/14)':'그린 호 (n° / 360°)'}</b></td></tr>
    </tbody></table>`;
}
$('#sl').oninput=e=>{ playing=false; cancelAnimationFrame(raf);
  $('#playIco').innerHTML='<path d="M7 4l13 8-13 8z"/>';
  P=+e.target.value/1000; $('#pct').textContent=Math.round(P*100)+'%'; render(); };
$('#play').onclick=play;
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#seg button').forEach(o=>o.classList.remove('on'));
  b.classList.add('on'); mode=b.dataset.m; P=0; playing=false; cancelAnimationFrame(raf);
  $('#sl').value=0; $('#pct').textContent='0%'; render(); play();
});
addEventListener('resize',()=>{sizeCanvas();render();});
setInterval(()=>{ if(!playing) render(); }, 90);   // 잡음이 지글거려야 한다
sizeCanvas(); renderTabs(); renderDesc(); render(); play();
</script>
</body>

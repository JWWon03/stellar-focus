<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>집중 연출 미리보기 · Stellar Focus</title>
<style>
/* 본편과 같은 제약: 외부 폰트·스크립트 없음. 이 파일 하나로 동작한다. */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04050b; --panel:rgba(16,20,34,.82); --line:rgba(255,255,255,.09);
  --line2:rgba(255,255,255,.18); --txt:#e8eefc; --txt2:#a8b6d4; --txt3:#6b7896;
  --acc:#8ab4ff;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--txt);overflow:hidden;
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ---- 조작판 ---- */
.bar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));
  width:min(560px,calc(100% - 24px));z-index:5;
  background:var(--panel);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:16px;padding:12px 14px 14px;
  box-shadow:0 10px 40px rgba(0,0,0,.55)
}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:11px}
.tab{
  padding:9px 4px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.03);
  color:var(--txt2);font-size:12px;font-weight:600;cursor:pointer;transition:.15s;text-align:center
}
.tab:hover{border-color:var(--line2);color:var(--txt)}
.tab.on{background:rgba(58,90,180,.42);border-color:rgba(138,180,255,.6);color:#fff}
.row{display:flex;align-items:center;gap:11px}
input[type=range]{
  flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;
  background:linear-gradient(90deg,var(--acc) var(--p,0%),rgba(255,255,255,.12) var(--p,0%));
  outline:none;cursor:pointer
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;
  border:2px solid var(--acc);cursor:pointer}
input[type=range]::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--acc);cursor:pointer}
.btn{
  padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.04);
  color:var(--txt);font-size:12px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap
}
.btn:hover{border-color:var(--line2)}
.btn.on{background:rgba(58,90,180,.42);border-color:rgba(138,180,255,.6)}
.pct{font-size:12px;color:var(--txt2);min-width:70px;text-align:right}
.note{font-size:11px;color:var(--txt3);margin-top:10px;line-height:1.55}
.note b{color:var(--txt2);font-weight:600}
.head{
  position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  z-index:5;font-size:11px;color:var(--txt3);letter-spacing:.04em;text-align:center;
  padding:0 16px
}
.head b{color:var(--txt2);font-weight:600}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="head">집중 연출 미리보기 · 본편에는 아직 적용되지 않았습니다</div>

<div class="bar">
  <div class="tabs">
    <div class="tab on" data-fx="comet">혜성 근일점</div>
    <div class="tab" data-fx="transit">엄폐(식)</div>
    <div class="tab" data-fx="probe">탐사선 항해</div>
  </div>
  <div class="row">
    <button class="btn" id="play">▶ 재생</button>
    <input type="range" id="prog" min="0" max="1000" value="0">
    <div class="pct mono" id="pct">0%</div>
  </div>
  <div class="note" id="note"></div>
</div>

<script>
/* ==========================================================================
   집중 연출 미리보기
   본편(index.html)에서 궤도 물리와 그리기 방식만 추려 왔다. 세션 진행도를
   0~1 로 직접 밀어 보며 연출을 판단하기 위한 것이고, 본편에는 아직 넣지
   않았다. 판단이 끝나면 고른 것만 옮긴다.
   ========================================================================== */
const TAU=Math.PI*2;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
let W=0,H=0,DPR=1;

function resize(){
  DPR=Math.min(2,devicePixelRatio||1);
  W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);resize();

/* ---- 결정론적 난수 (본편과 같은 방식) ---- */
function fnv(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---- 궤도 물리 ---- */
function kepler(M,e){
  M=((M%TAU)+TAU)%TAU;
  let E=e<.8?M:Math.PI;
  for(let k=0;k<8;k++){const d=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));E-=d;if(Math.abs(d)<1e-9)break;}
  return E;
}
/** 궤도 요소 + 평균근점이각 → 궤도면 좌표 */
function posFromM(el,M){
  const E=kepler(M,el.e);
  const x0=el.a*(Math.cos(E)-el.e);
  const y0=el.a*Math.sqrt(1-el.e*el.e)*Math.sin(E);
  const cw=Math.cos(el.peri),sw=Math.sin(el.peri);
  return {x:x0*cw-y0*sw, y:x0*sw+y0*cw};
}
/* 시점은 연출마다 다르다. 식(엄폐)은 궤도면을 옆에서 봐야 천체가 별 앞을
   가로지르는 것이 보인다 — 위에서 내려다보면 겹치는 일이 없다. */
let TILT=0.28;
const TILT_OF={comet:0.28, transit:1.44, probe:0.28};
function geom(){ return {cx:W/2, cy:H*0.44, R:Math.min(W,H)*0.34}; }
function toScreen(p,g){ return {x:g.cx+p.x*g.R, y:g.cy+p.y*g.R*Math.cos(TILT)}; }

/* ---- 장면: 중심별 + 행성 + 카이퍼 벨트 ---- */
const PLANETS=[];
{
  const r=mulberry(fnv('preview-planets'));
  const col=['#c8b9a8','#e8c9a0','#7fb3e8','#e0785a','#dcc79a'];
  for(let i=0;i<5;i++){
    PLANETS.push({
      el:{a:0.30+i*0.15, e:0.02+r()*0.05, peri:r()*TAU},
      M0:r()*TAU, sz:2.6+r()*3.4, c:col[i], sp:Math.pow(1/(0.30+i*0.15),1.5)
    });
  }
}
const BELT=[];
{
  const r=mulberry(fnv('preview-belt'));
  for(let i=0;i<520;i++){
    const th=r()*TAU, rt=0.10*Math.sqrt(r());
    BELT.push({
      el:{a:1.28+rt*Math.cos(th), e:0.004+r()*0.02, peri:r()*TAU},
      M0:r()*TAU, z:rt*Math.sin(th), br:0.4+r()*0.6, sz:0.5+r()*0.9
    });
  }
}
const AU_REF=30;                       // 기준 궤도를 30 AU 로 본다 (본편과 같은 척도)

function drawScene(t,dim){
  const g=geom();
  const k=dim===undefined?1:dim;      // 주변 천체를 물러나게 하는 배율
  // 궤도선
  ctx.save();
  ctx.strokeStyle='rgba(150,180,255,'+(0.14*k).toFixed(3)+')';ctx.lineWidth=1;
  PLANETS.forEach(p=>{
    ctx.beginPath();
    for(let k=0;k<=90;k++){
      const s=toScreen(posFromM(p.el,k/90*TAU),g);
      k?ctx.lineTo(s.x,s.y):ctx.moveTo(s.x,s.y);
    }
    ctx.closePath();ctx.stroke();
  });
  ctx.restore();

  // 카이퍼 벨트 — 별 반대편이 밝고 이쪽 편이 어둡다 (본편과 같은 위상 처리)
  ctx.save();
  BELT.forEach(o=>{
    const p=posFromM(o.el,o.M0+t*0.05);
    const s=toScreen(p,g);
    const depth=(p.y*Math.sin(TILT)+o.z*Math.cos(TILT));
    const rr=Math.hypot(p.x,p.y,o.z)||1e-6;
    const f=clamp((1-depth/rr)*0.5,0,1);
    ctx.globalAlpha=(0.10+0.34*f*f)*o.br*k;
    ctx.fillStyle='#a8b6c6';
    const rad=Math.max(0.5,o.sz*g.R*0.0042);
    ctx.beginPath();ctx.arc(s.x,s.y+o.z*g.R*Math.cos(TILT)*0.6,rad,0,TAU);ctx.fill();
  });
  ctx.restore();

  // 행성
  ctx.save();
  ctx.globalAlpha=k;
  PLANETS.forEach(p=>{
    const s=toScreen(posFromM(p.el,p.M0+t*p.sp*0.05),g);
    ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(s.x,s.y,p.sz,0,TAU);ctx.fill();
  });
  ctx.restore();

  // 중심별 — 집중 중 모습(코로나를 줄이고 경계가 뚜렷한 원)
  const sc=toScreen({x:0,y:0},g), R=Math.max(7,g.R*0.055);
  const halo=ctx.createRadialGradient(sc.x,sc.y,R*.6,sc.x,sc.y,R*1.9);
  halo.addColorStop(0,'rgba(255,214,140,.42)');
  halo.addColorStop(1,'rgba(255,160,60,0)');
  ctx.fillStyle=halo;ctx.beginPath();ctx.arc(sc.x,sc.y,R*1.9,0,TAU);ctx.fill();
  const body=ctx.createRadialGradient(sc.x-R*.2,sc.y-R*.2,R*.1,sc.x,sc.y,R);
  body.addColorStop(0,'#fff6df');body.addColorStop(1,'#ffb457');
  ctx.fillStyle=body;ctx.beginPath();ctx.arc(sc.x,sc.y,R,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(255,236,200,.85)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.arc(sc.x,sc.y,R+0.6,0,TAU);ctx.stroke();
  return {g,star:sc,R};
}

/* ---- 화면 질감: 모눈 + 스캔라인 ---- */
function drawGrid(col){
  const step=Math.max(44,Math.round(Math.min(W,H)/14));
  ctx.save();
  ctx.strokeStyle=col||'rgba(138,180,255,.055)';ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=step/2;x<W;x+=step){ctx.moveTo((x|0)+.5,0);ctx.lineTo((x|0)+.5,H);}
  for(let y=step/2;y<H;y+=step){ctx.moveTo(0,(y|0)+.5);ctx.lineTo(W,(y|0)+.5);}
  ctx.stroke();ctx.restore();
}
let _scan=null;
function drawScan(){
  if(!_scan){
    const c=document.createElement('canvas');c.width=1;c.height=3;
    const x=c.getContext('2d');x.fillStyle='rgba(0,0,0,.30)';x.fillRect(0,0,1,1);
    _scan=ctx.createPattern(c,'repeat');
  }
  ctx.save();ctx.globalAlpha=.32;ctx.fillStyle=_scan;ctx.fillRect(0,0,W,H);ctx.restore();
}
function readout(lines){
  ctx.save();
  ctx.font='500 10px ui-monospace,SFMono-Regular,Menlo,monospace';
  ctx.textAlign='right';ctx.fillStyle='rgba(150,175,220,.62)';
  const y0=44;                                   // 아래는 조작판이 덮는다
  lines.forEach((t,i)=>ctx.fillText(t,W-18,y0+i*14));
  ctx.restore();
}

/* ==========================================================================
   A. 혜성 근일점
   이심률 큰 타원을 실선으로 그리고, 혜성은 작은 점 하나로 둔다.
   꼬리는 태양풍에 밀리는 실제 혜성처럼 언제나 중심별 반대편을 향하고,
   가까워질수록 길어진다. 평균근점이각을 진행도에 비례해 움직이므로
   (실제 궤도도 평균근점이각이 시간에 비례한다) 세션이 끝나는 순간
   정확히 근일점에 닿는다.
   ========================================================================== */
/* 타원의 모양은 진짜지만, 자리를 잡는 방식이 다르다.
   케플러 시간(평균근점이각)을 그대로 쓰면 이심률이 큰 궤도는 원일점 근처에서
   아주 느려 세션의 대부분을 화면 밖에서 보낸다. 그래서 거리 r 을 진행도에
   비례해 줄이고, 그 r 에 해당하는 진근점이각을 궤도 방정식에서 거꾸로 구한다.
   결과: 경로는 정확한 타원, 다가오는 속도는 타이머에 비례, 끝나는 순간 근일점. */
const COMET={e:0.86, rPeri:0.30, peri:-0.72};
COMET.a=COMET.rPeri/(1-COMET.e);
COMET.p=COMET.a*(1-COMET.e*COMET.e);
/** 거리 r 에서의 진근점이각 (다가오는 쪽이라 음수) */
function cometNu(r){
  return -Math.acos(clamp((COMET.p/r-1)/COMET.e,-1,1));
}
function cometPos(r){
  const nu=cometNu(r), a=nu+COMET.peri;
  return {x:Math.cos(a)*r, y:Math.sin(a)*r, nu};
}
/** 화면 밖에서 시작하도록 첫 거리를 잡는다.
    화면 대각선으로 어림잡으면 들어오는 방향에 따라 한참 뒤에야 보인다.
    실제로 화면을 벗어나는 지점을 찾아 그 조금 바깥에서 출발한다. */
function cometStartR(g){
  const m=8;                                       // 화면 가장자리 바로 바깥
  const inFrame=r=>{
    const s=toScreen(cometPos(r),g);
    return s.x>-m&&s.x<W+m&&s.y>-m&&s.y<H+m;
  };
  let lo=COMET.rPeri, hi=Math.min(COMET.a*(1+COMET.e)*0.98,6);
  if(inFrame(hi)) return hi;
  for(let i=0;i<24;i++){const mid=(lo+hi)/2;if(inFrame(mid))lo=mid;else hi=mid;}
  return lo*1.03;
}
function fxComet(prog,t){
  const {g,star,R}=drawScene(t);
  drawGrid();

  const r0=cometStartR(g);
  const r=r0+(COMET.rPeri-r0)*prog;          // 거리가 타이머에 비례한다
  const p=cometPos(r);
  const s=toScreen(p,g);

  // 궤도 — 타원 전체를 옅게 깔고, 지나온 구간만 또렷하게 덧그린다
  const arc=(n0,n1,style,wd,dash)=>{
    ctx.save();
    if(dash)ctx.setLineDash(dash);
    ctx.strokeStyle=style;ctx.lineWidth=wd;
    ctx.beginPath();
    const N=160;
    for(let k=0;k<=N;k++){
      const nu=n0+(n1-n0)*k/N;
      const rr=COMET.p/(1+COMET.e*Math.cos(nu));
      if(rr>60)continue;                     // 원일점 쪽이 너무 멀면 건너뛴다
      const a=nu+COMET.peri;
      const sc=toScreen({x:Math.cos(a)*rr,y:Math.sin(a)*rr},g);
      k?ctx.lineTo(sc.x,sc.y):ctx.moveTo(sc.x,sc.y);
    }
    ctx.stroke();ctx.restore();
  };
  const nu0=cometNu(r0), nuNow=p.nu;
  arc(-Math.PI*0.995,Math.PI*0.995,'rgba(150,180,255,.13)',1);      // 궤도 전체
  arc(nuNow,0,'rgba(150,180,255,.28)',1,[4,6]);                     // 남은 길
  arc(nu0,nuNow,'rgba(168,208,255,.5)',1.4);                        // 지나온 길

  // ---- 꼬리 ----
  // 실제 혜성은 꼬리가 둘이고 생김새가 다르다.
  //  이온 꼬리: 태양풍에 곧장 밀려 별 반대편으로 곧게 뻗고, 매듭이 바깥으로
  //             흘러가며 가닥이 갈라진다. 푸르다.
  //  먼지 꼬리: 무거워서 곧바로 밀리지 못하고 제 궤도에 뒤처지므로 휘어진
  //             부채꼴이 된다. 노르스름하다.
  const near=clamp((r0-r)/(r0-COMET.rPeri),0,1);
  const act=Math.pow(near,1.6);                  // 활동도 — 가까울수록 격해진다
  const dx=s.x-star.x, dy=s.y-star.y, dl=Math.hypot(dx,dy)||1;
  const ux=dx/dl, uy=dy/dl;                      // 별 반대 방향 (반태양 방향)
  const px=-uy, py=ux;                           // 그 수직 방향
  const ionL=Math.min(W,H)*(0.06+0.44*act);

  ctx.save();
  ctx.lineCap='round';

  // 먼지 꼬리 — 지나온 궤도 위에서 뿌려진 먼지가 뒤처지며 휘어진다.
  // 과거 위치에서 반태양 방향으로 밀어낸 점들을 이어 부채꼴을 만든다.
  const dustL=ionL*0.60;
  const lanes=5;
  for(let L=0;L<lanes;L++){
    const w=(L/(lanes-1))*2-1;                   // -1..1 부채 폭
    ctx.beginPath();
    for(let k=0;k<=22;k++){
      const age=k/22;                            // 0=지금 뿌린 것, 1=오래된 것
      const rp=r+(r0-r)*age*0.085;               // 그때는 조금 더 멀리 있었다
      const q=cometPos(rp), sp=toScreen(q,g);
      const bx=sp.x-star.x, by=sp.y-star.y, bl=Math.hypot(bx,by)||1;
      const push=dustL*Math.pow(age,0.85);
      const spread=push*0.11*w;
      const X=sp.x+bx/bl*push+(-by/bl)*spread;
      const Y=sp.y+by/bl*push+( bx/bl)*spread;
      k?ctx.lineTo(X,Y):ctx.moveTo(X,Y);
    }
    const fade=1-Math.abs(w)*0.55;
    ctx.strokeStyle='rgba(255,226,178,'+(0.16*act*fade).toFixed(3)+')';
    ctx.lineWidth=Math.max(2,Math.min(W,H)*0.016*(0.4+act))*fade;
    ctx.stroke();
  }

  // 이온 꼬리 — 곧게 뻗은 가닥 여럿. 옆으로 미세하게 흔들리고 매듭이 흐른다.
  const strands=4;
  for(let i=0;i<strands;i++){
    const off=(i-(strands-1)/2)/strands;
    ctx.beginPath();
    for(let k=0;k<=26;k++){
      const q=k/26;
      const wob=Math.sin(t*1.1+i*2.1+q*5.5)*ionL*0.035*q;   // 태양풍에 흔들린다
      const X=s.x+ux*ionL*q+px*(off*ionL*0.10*q+wob);
      const Y=s.y+uy*ionL*q+py*(off*ionL*0.10*q+wob);
      k?ctx.lineTo(X,Y):ctx.moveTo(X,Y);
    }
    const gi=ctx.createLinearGradient(s.x,s.y,s.x+ux*ionL,s.y+uy*ionL);
    const a0=(0.30+0.45*act)*(1-Math.abs(off)*1.1);
    gi.addColorStop(0,'rgba(214,236,255,'+a0.toFixed(3)+')');
    gi.addColorStop(.45,'rgba(150,196,255,'+(a0*0.34).toFixed(3)+')');
    gi.addColorStop(1,'rgba(120,170,255,0)');
    ctx.strokeStyle=gi;
    ctx.lineWidth=Math.max(1,Math.min(W,H)*0.004*(0.5+act));
    ctx.stroke();
  }

  // 매듭 — 이온 꼬리를 따라 바깥으로 흘러간다
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<7;i++){
    const q=((t*0.16+i/7)%1);
    const wob=Math.sin(t*1.1+i*2.1+q*5.5)*ionL*0.03*q;
    const X=s.x+ux*ionL*q+px*wob, Y=s.y+uy*ionL*q+py*wob;
    const rad=Math.min(W,H)*0.006*(1-q*0.6);
    const kg=ctx.createRadialGradient(X,Y,0,X,Y,rad);
    kg.addColorStop(0,'rgba(190,225,255,'+(0.30*act*(1-q)).toFixed(3)+')');
    kg.addColorStop(1,'rgba(150,200,255,0)');
    ctx.fillStyle=kg;ctx.beginPath();ctx.arc(X,Y,rad,0,TAU);ctx.fill();
  }
  ctx.restore();

  // 코마 — 핵을 감싼 대기. 가까울수록 부풀고 옅게 흔들린다.
  const hr=Math.max(1.6,Math.min(W,H)*0.0034);
  const comaR=hr*(3.5+9*act)*(1+0.06*Math.sin(t*2.3));
  const cg=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,comaR);
  cg.addColorStop(0,'rgba(255,255,255,'+(0.55+0.4*act).toFixed(3)+')');
  cg.addColorStop(.35,'rgba(205,235,255,'+(0.22*act+0.06).toFixed(3)+')');
  cg.addColorStop(1,'rgba(170,215,255,0)');
  ctx.fillStyle=cg;ctx.beginPath();ctx.arc(s.x,s.y,comaR,0,TAU);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,hr,0,TAU);ctx.fill();

  // 표적 표시 — 수치를 브래킷 옆에 붙인다 (벨트 탐사와 같은 결)
  // 속도는 비스-비바 식 그대로다: v = 29.78 * sqrt(2/r - 1/a)  [AU, km/s]
  const auR=r*AU_REF, auA=COMET.a*AU_REF;
  const vel=29.78*Math.sqrt(Math.max(0,2/auR-1/auA));
  // 화면 밖에 있으면 표식도 수치도 띄우지 않는다 — 없는 것을 가리킬 수는 없다
  const onScreen=s.x>6&&s.x<W-6&&s.y>6&&s.y<H-6;
  if(onScreen) drawTargetBox(s,'255,196,64',[
    'C/2026 SF1',
    auR.toFixed(2)+' AU   v '+vel.toFixed(1)+' km/s',
    'TAIL '+(ionL/Math.min(W,H)*100|0)+' %   ACT '+(act*100|0)+' %',
    'PERIHELION  T-'+((1-prog)*100).toFixed(0)+'%'
  ]);
  drawScan();
}

/** 네 모서리 브래킷 + 그 옆의 수치. 오른쪽에 자리가 없으면 왼쪽에 붙인다. */
function drawTargetBox(s,col,lines){
  const C=a=>'rgba('+col+','+a+')';
  const half=14, arm=6;
  ctx.save();
  ctx.strokeStyle=C(.8);ctx.lineWidth=1.3;ctx.lineCap='butt';
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sy])=>{
    ctx.beginPath();
    ctx.moveTo(s.x+sx*half, s.y+sy*half-sy*arm);
    ctx.lineTo(s.x+sx*half, s.y+sy*half);
    ctx.lineTo(s.x+sx*half-sx*arm, s.y+sy*half);
    ctx.stroke();
  });
  ctx.font='500 10px ui-monospace,SFMono-Regular,Menlo,monospace';
  let bw=0;lines.forEach(t=>{bw=Math.max(bw,ctx.measureText(t).width);});
  const right=s.x+half+bw+10<W-6;
  ctx.textAlign=right?'left':'right';
  const tx=right?s.x+half+7:s.x-half-7;
  const ty=s.y-(lines.length-1)*6-1;
  lines.forEach((t,i)=>{
    ctx.fillStyle=i===0?C(.95):'rgba(198,216,248,.82)';
    ctx.fillText(t,tx,ty+i*12);
  });
  ctx.restore();
}

/* ==========================================================================
   B. 엄폐(식) 관측
   행성 하나가 중심별 앞을 가로지르고, 세션이 끝나는 순간 가장 많이 가린다.
   두 원의 겹친 넓이로 밝기를 계산해 광도 곡선을 함께 그린다 — 실제 외계행성을
   찾아내는 방법이 이것이다.
   ========================================================================== */
function lensArea(d,r1,r2){            // 두 원이 겹친 넓이
  if(d>=r1+r2)return 0;
  if(d<=Math.abs(r1-r2))return Math.PI*Math.min(r1,r2)**2;
  const a1=Math.acos((d*d+r1*r1-r2*r2)/(2*d*r1));
  const a2=Math.acos((d*d+r2*r2-r1*r1)/(2*d*r2));
  return r1*r1*(a1-Math.sin(2*a1)/2)+r2*r2*(a2-Math.sin(2*a2)/2);
}
/* 통과 기하 — 세션이 시작할 때는 아직 별 앞에 오기 전이고, 끝날 때는 이미
   빠져나가 밝기가 회복된 뒤다. 그래야 광도 곡선이 온전한 U 자로 완성되고
   거기서 수치를 뽑을 수 있다. */
const TR={k:0.115, b:0.28};              // 반지름비 Rp/Rs, 충돌 매개변수
TR.x0=(1+TR.k)*1.55;                     // 시작 위치 (별 반지름 단위)
function transitX(prog){ return -TR.x0+2*TR.x0*prog; }
/** 진행도에서의 상대 밝기 */
function transitFlux(prog){
  const d=Math.hypot(transitX(prog),TR.b);
  return 1-lensArea(d,1,TR.k)/Math.PI;
}
/** 접촉 시각 — 밝기가 처음 떨어지는 때와 완전히 회복되는 때 */
const TR_C={};
{
  let lo=0,hi=0.5;                              // 밝기가 처음 떨어지는 지점
  for(let i=0;i<40;i++){
    const m=(lo+hi)/2;
    if(transitFlux(m)<0.99999) hi=m; else lo=m;
  }
  TR_C.c1=(lo+hi)/2; TR_C.c4=1-TR_C.c1;         // 대칭이다
}
function fxTransit(prog,t){
  // 관측 대상은 중심별과 미지의 천체뿐이다. 나머지는 물러나게 둔다.
  const {g,star,R}=drawScene(t,0.22);
  drawGrid('rgba(96,220,140,.075)');            // 레이더처럼 초록 모눈

  const flux0=transitFlux(prog);
  const pr=R*TR.k*3.4;                   // 눈에 보이게 조금 키운다
  const px=star.x+transitX(prog)*R, py=star.y+TR.b*R*0.35;

  // 지나갈 길
  ctx.save();
  ctx.setLineDash([3,8]);ctx.strokeStyle='rgba(150,180,255,.20)';ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(star.x-TR.x0*R,py);ctx.lineTo(star.x+TR.x0*R,py);ctx.stroke();
  ctx.restore();

  ctx.fillStyle='#12161f';
  ctx.beginPath();ctx.arc(px,py,pr,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(120,235,170,.75)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.arc(px,py,pr,0,TAU);ctx.stroke();
  // 미지의 천체에 표식을 붙인다
  drawTargetBox({x:px,y:py},'96,220,140',[
    'UNKNOWN BODY',
    'FLUX '+flux0.toFixed(5)
  ]);

  const flux=transitFlux(prog), depth=1-transitFlux(0.5);
  // ---- 광도 곡선 ----
  const gw=Math.min(228,W-44), gh=58, gx0=20, gy0=54;
  ctx.save();
  ctx.fillStyle='rgba(10,14,24,.6)';
  ctx.strokeStyle='rgba(255,255,255,.09)';ctx.lineWidth=1;
  ctx.beginPath();ctx.rect(gx0,gy0,gw,gh);ctx.fill();ctx.stroke();
  const lo=1-depth*1.5, span=depth*1.9||1e-6;
  const yOf=v=>gy0+gh-5-(v-lo)/span*(gh-12);
  // 관측된 구간만 그린다 — 아직 오지 않은 미래를 미리 보여주면 안 된다
  ctx.strokeStyle='rgba(120,235,170,.9)';ctx.lineWidth=1.4;
  ctx.beginPath();
  const N=Math.max(2,Math.round(120*prog));
  for(let k=0;k<=N;k++){
    const q=prog*k/N;
    const X=gx0+gw*q, Y=clamp(yOf(transitFlux(q)),gy0+3,gy0+gh-3);
    k?ctx.lineTo(X,Y):ctx.moveTo(X,Y);
  }
  ctx.stroke();
  // 기준선
  ctx.setLineDash([2,4]);ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(gx0,yOf(1));ctx.lineTo(gx0+gw,yOf(1));ctx.stroke();
  ctx.setLineDash([]);
  ctx.font='500 9px ui-monospace,SFMono-Regular,Menlo,monospace';
  ctx.textAlign='left';ctx.fillStyle='rgba(150,175,220,.72)';
  ctx.fillText('RELATIVE FLUX  '+flux.toFixed(5),gx0+2,gy0-6);
  ctx.restore();

  // ---- 관측에서 수치를 뽑아 가는 과정 ----
  // 통과가 진행될수록 알 수 있는 것이 늘어난다. 실제 외계행성 관측이 그렇다.
  const phase=prog<TR_C.c1?0:prog<0.5?1:prog<TR_C.c4?2:3;
  const durH=6.4;                                        // 관측된 통과 시간(시간)
  const rpRs=Math.sqrt(depth);
  const lines=[
    'TRANSIT  SF-114 b',
    'STAR  G2V   m_V 11.42'
  ];
  if(phase===0) lines.push('BASELINE  —  AWAITING INGRESS');
  if(phase>=1) lines.push('INGRESS  T+'+(TR_C.c1*100).toFixed(0)+'%   DEPTH '+(depth*100).toFixed(2)+' %');
  if(phase>=2) lines.push('Rp/Rs  '+rpRs.toFixed(3)+'   →  Rp  '+(rpRs*109.2).toFixed(2)+' R⊕');
  if(phase>=3){
    lines.push('EGRESS  DURATION '+durH.toFixed(1)+' h');
    lines.push('a  0.048 AU   P  4.12 d');
    lines.push('M_V  +4.85   d  '+(Math.pow(10,(11.42-4.85+5)/5)/1).toFixed(0)+' pc');
  }
  readout(lines);

  drawScan();
}

/* ==========================================================================
   C. 탐사선 항해
   중심별에서 출발해 카이퍼 벨트를 향해 나아가고, 도착이 곧 완료다.
   지나온 경로는 실선, 남은 경로는 점선으로 남는다.
   ========================================================================== */
/* 스윙바이 항해.
   실제 외행성 탐사선은 곧장 가지 않는다. 도중에 행성 곁을 스쳐 그 중력으로
   방향을 틀고 속도를 얻는다(중력도움). 그래서 경로가 한 번 꺾이고, 꺾인
   뒤가 더 빠르다.
     다리 1  발사 → 중력도움 천체 (느리게, 크게 돌아서)
     다리 2  스윙바이 → 카이퍼 벨트 (빠르게, 바깥으로) */
const SWING={
  rLaunch:0.10, rA:0.60, rEnd:1.34,   // 발사·중력도움·목표 반지름
  a0:-2.35, aA:-0.30, aEnd:0.62,      // 각 구간의 각도
  qA:0.52,                            // 스윙바이가 일어나는 진행도
  // 각 다리의 장반경(AU). 다리 1 은 발사점을 근일점, 중력도움 천체를
  // 원일점으로 하는 전이 타원이다. 스윙바이로 에너지를 얻어 다리 2 는
  // 훨씬 큰 궤도가 된다 — 그래야 벨트까지 나간다.
  a1AU:(0.10+0.60)/2*AU_REF,
  a2AU:60
};
/* 구간 끝에서 변화율이 0 이 되는 보간을 쓰면 탐사선이 실제로 멈춰 선다.
   지수를 1 미만으로 두어 끝에서도 계속 움직이게 한다. */
function probePos(q){
  let r,a;
  if(q<SWING.qA){
    const u=q/SWING.qA;
    r=SWING.rLaunch+(SWING.rA-SWING.rLaunch)*Math.pow(u,0.72);
    a=SWING.a0+(SWING.aA-SWING.a0)*Math.pow(u,0.86);
  }else{
    const u=(q-SWING.qA)/(1-SWING.qA);
    const e=1-Math.pow(1-u,1.7);      // 스윙바이 직후가 가장 빠르다
    r=SWING.rA+(SWING.rEnd-SWING.rA)*e;
    a=SWING.aA+(SWING.aEnd-SWING.aA)*e;
  }
  return {x:Math.cos(a)*r, y:Math.sin(a)*r, r, a};
}
/** 태양중심 속도. 반지름 변화만 보면 원일점에서 0 이 나온다 —
    접선 방향 성분이 빠지기 때문이다. 비스-비바 식으로 제대로 구한다. */
function probeSpeed(q){
  const r=probePos(q).r*AU_REF;
  const aAU=q<SWING.qA?SWING.a1AU:SWING.a2AU;
  return 29.78*Math.sqrt(Math.max(0.0001,2/r-1/aAU));
}
/** 중력도움 천체의 자리 */
function assistPos(){
  return {x:Math.cos(SWING.aA)*SWING.rA, y:Math.sin(SWING.aA)*SWING.rA};
}
function fxProbe(prog,t){
  const {g,star,R}=drawScene(t);
  drawGrid();

  const path=(q0,q1,style,wd,dash)=>{
    ctx.save();
    if(dash)ctx.setLineDash(dash);
    ctx.strokeStyle=style;ctx.lineWidth=wd;
    ctx.beginPath();
    const N=110;
    for(let k=0;k<=N;k++){
      const s=toScreen(probePos(q0+(q1-q0)*k/N),g);
      k?ctx.lineTo(s.x,s.y):ctx.moveTo(s.x,s.y);
    }
    ctx.stroke();ctx.restore();
  };
  path(prog,1,'rgba(150,180,255,.22)',1,[4,6]);
  path(0,prog,'rgba(168,208,255,.5)',1.4);

  // 중력도움 천체와 스쳐 지나는 자리
  const ap=toScreen(assistPos(),g);
  ctx.save();
  ctx.strokeStyle=prog>=SWING.qA?'rgba(168,208,255,.35)':'rgba(255,196,64,.45)';
  ctx.setLineDash([2,4]);ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(ap.x,ap.y,16,0,TAU);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#cbb89a';
  ctx.beginPath();ctx.arc(ap.x,ap.y,4.6,0,TAU);ctx.fill();
  ctx.font='500 9px ui-monospace,SFMono-Regular,Menlo,monospace';
  ctx.textAlign='center';
  ctx.fillStyle=prog>=SWING.qA?'rgba(150,175,220,.5)':'rgba(255,196,64,.75)';
  ctx.fillText('GRAVITY ASSIST',ap.x,ap.y+42);
  ctx.restore();

  const p=probePos(prog), s=toScreen(p,g);
  const ahead=probePos(Math.min(1,prog+0.006)), sa=toScreen(ahead,g);
  const ang=Math.atan2(sa.y-s.y,sa.x-s.x);

  // 추진 불꽃 — 진행 반대 방향
  const fl=ctx.createLinearGradient(s.x,s.y,s.x-Math.cos(ang)*22,s.y-Math.sin(ang)*22);
  fl.addColorStop(0,'rgba(170,215,255,.75)');
  fl.addColorStop(1,'rgba(120,170,255,0)');
  ctx.save();
  ctx.strokeStyle=fl;ctx.lineCap='round';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(s.x,s.y);
  ctx.lineTo(s.x-Math.cos(ang)*22,s.y-Math.sin(ang)*22);ctx.stroke();
  ctx.restore();

  // 본체
  ctx.save();
  ctx.translate(s.x,s.y);ctx.rotate(ang);
  ctx.fillStyle='#e8eefc';
  ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(-4,3.2);ctx.lineTo(-4,-3.2);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(200,220,255,.65)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(-1,-3.2);ctx.lineTo(-1,-7);ctx.moveTo(-1,3.2);ctx.lineTo(-1,7);ctx.stroke();
  ctx.restore();

  // ---- 관측 수치 ----
  const MISSION_Y=18;                          // 이 항해에 걸리는 햇수
  const au=p.r*AU_REF;
  const v=probeSpeed(prog);
  const lag=au*499.0;                          // 빛이 닿는 시간(초). 1 AU = 499초
  const hh=Math.floor(lag/3600), mm=Math.floor(lag%3600/60);
  drawTargetBox(s,'96,214,255',[
    'SF-VOYAGER',
    au.toFixed(2)+' AU   v '+v.toFixed(1)+' km/s',
    'DELAY '+hh+'h'+String(mm).padStart(2,'0')+'m   T+'+(prog*MISSION_Y).toFixed(1)+' y',
    prog<SWING.qA?'CRUISE → ASSIST T-'+((SWING.qA-prog)*100).toFixed(0)+'%'
                 :'POST-ASSIST → BELT T-'+((1-prog)*100).toFixed(0)+'%'
  ]);
  drawScan();
}

let fx='comet', prog=0, playing=false, playT=0;
const $=s=>document.querySelector(s);
const slider=$('#prog'), pct=$('#pct'), note=$('#note');

function setProg(v){
  prog=clamp(v,0,1);
  slider.value=Math.round(prog*1000);
  slider.style.setProperty('--p',(prog*100).toFixed(1)+'%');
  pct.textContent=(prog*100).toFixed(0)+'%';
}
slider.addEventListener('input',()=>{playing=false;$('#play').classList.remove('on');
  $('#play').textContent='▶ 재생';setProg(+slider.value/1000);});
$('#play').onclick=()=>{
  playing=!playing;
  if(playing&&prog>=1)setProg(0);
  $('#play').classList.toggle('on',playing);
  $('#play').textContent=playing?'❚❚ 정지':'▶ 재생';
  playT=performance.now();
};
document.querySelectorAll('.tab').forEach(el=>el.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  el.classList.add('on'); fx=el.dataset.fx; note.innerHTML=NOTES[fx];
});
note.innerHTML=NOTES.comet;
setProg(0);

const PLAY_MS=22000;                   // 한 세션을 22초로 압축해 보여준다
let last=performance.now();
(function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(playing){
    setProg(prog+dt*1000/PLAY_MS);
    if(prog>=1){playing=false;$('#play').classList.remove('on');$('#play').textContent='▶ 재생';}
  }
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#04050b';ctx.fillRect(0,0,W,H);
  const t=now/1000;
  TILT=TILT_OF[fx];                    // 식은 옆에서 봐야 보인다
  if(fx==='comet')fxComet(prog,t);
  else if(fx==='transit')fxTransit(prog,t);
  else fxProbe(prog,t);
  requestAnimationFrame(loop);
})(performance.now());
</script>
</body>
